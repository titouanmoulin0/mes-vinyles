                            <rect x="6" y="5" width="4" height="14" rx="1" fill="#171717"/>
                            <rect x="14" y="5" width="4" height="14" rx="1" fill="#171717"/>

                    <audio id="audioEl"></audio>
                </div>

                <div class="detail-meta">

        <!-- BOTTOM : carousel Bio / Tracklist / Infos -->
        <div class="detail-bottom">
            <div class="carousel-nav">
                <button class="carousel-arrow" id="prevBtn" disabled>
                    <svg viewBox="0 0 10 10" fill="none">
                        <path d="M6.5 1.5L3 5l3.5 3.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="carousel-dots" id="carouselDots">
                    <div class="carousel-dot active"></div>
                    <div class="carousel-dot"></div>
                    <div class="carousel-dot"></div>
                </div>
                <button class="carousel-arrow" id="nextBtn">
                    <svg viewBox="0 0 10 10" fill="none">
                        <path d="M3.5 1.5L7 5l-3.5 3.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <div class="carousel-panels">

                <!-- Panel 0 : Bio -->
                <div class="carousel-panel active" id="panel-0">
                    <p class="panel-title">Bio</p>
                    <p class="bio-text" id="bioText">Chargement…</p>
                </div>

                <!-- Panel 1 : Tracklist -->
                <div class="carousel-panel" id="panel-1">
                    <p class="panel-title">Tracklist</p>
                    <div class="track-grid" id="trackGrid"></div>
                </div>

                <!-- Panel 2 : Infos -->
                <div class="carousel-panel" id="panel-2">
                    <p class="panel-title">Informations</p>
                    <div class="info-list" id="infoList"></div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabase = createClient(
            'https://zajqhodbbxwzkauupsch.supabase.co',
            'sb_publishable_Yu8voA0zf_wgOHIMRMwTNg_7A_tb__T'
        );

        // ── ID depuis l'URL ───────────────────────────────────
        const id = new URLSearchParams(window.location.search).get('id');

        // ── CAROUSEL ─────────────────────────────────────────
        let current = 0;
        const total = 3;
        const panels = [0,1,2].map(i => document.getElementById(`panel-${i}`));
        const dots   = document.querySelectorAll('.carousel-dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function goTo(idx) {
            panels[current].classList.remove('active');
            panels[current].classList.add('exit-left');
            setTimeout(() => panels[current].classList.remove('exit-left'), 300);

            current = idx;
            panels[current].classList.add('active');

            dots.forEach((d,i) => d.classList.toggle('active', i === current));
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        prevBtn.addEventListener('click', () => { if (current > 0) goTo(current - 1); });
        nextBtn.addEventListener('click', () => { if (current < total - 1) goTo(current + 1); });

        // Swipe support
        let touchStartX = 0;
        document.querySelector('.carousel-panels').addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });
        document.querySelector('.carousel-panels').addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (dx < -50 && current < total - 1) goTo(current + 1);
            if (dx > 50  && current > 0)         goTo(current - 1);
        });

        // ── AUDIO ────────────────────────────────────────────
        const audio          = document.getElementById('audioEl');
        const coverPauseBtn  = document.getElementById('coverPauseBtn');
        const coverPauseIcon = document.getElementById('coverPauseIcon');

        const pausePath = '<rect x="6" y="5" width="4" height="14" rx="1" fill="#171717"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#171717"/>';
        const playPath  = '<path d="M7 5L19 12L7 19V5Z" fill="#171717"/>';

        coverPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                coverPauseIcon.innerHTML = pausePath;
            } else {
                audio.pause();
                coverPauseIcon.innerHTML = playPath;
            }
        });

        audio.addEventListener('ended', () => {
            coverPauseIcon.innerHTML = playPath;
        });

        // ── RENDER ───────────────────────────────────────────
        function renderVinyle(v, tracks) {
            const cover = v.cover_url || `assets/covers/${v.id}.jpg`;
            const coverEl = document.getElementById('detailCover');
            coverEl.src = cover;
            coverEl.style.display = 'block';
            document.getElementById('skeletonCover').style.display = 'none';

            // Meta
            document.getElementById('detailTitle').textContent = v.nom;
            document.getElementById('detailArtist').textContent = v.artiste;
            document.title = v.nom;

            // Bio
            document.getElementById('bioText').textContent =
                v.bio || 'Aucune biographie disponible pour cet album.';

            // Tracklist
            const favori = tracks.find(t => t.est_favori);
            const grid = document.getElementById('trackGrid');
            grid.innerHTML = tracks.map(t => `
                <div class="track-item ${t.est_favori ? 'favori' : ''}">
                    <span class="track-num">${t.position}</span>
                    <span class="track-name">${t.titre}</span>
                </div>`).join('');

            // Audio : autoplay dès que la src est prête
            if (favori && favori.audio_url) {
                audio.src = favori.audio_url;
                coverPauseBtn.style.display = 'flex';
                coverPauseIcon.innerHTML = pausePath;
                audio.play().catch(() => {
                    // Autoplay bloqué par le navigateur — on attend un geste
                    coverPauseIcon.innerHTML = playPath;
                });
            }

            // Infos
            const fmt = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
            const genres = Array.isArray(v.genres) ? v.genres : [];

            document.getElementById('infoList').innerHTML = `
                <div class="info-row">
                    <span class="info-label">Genres</span>
                    <span class="info-value">${genres.map(g => `<span class="genre-tag">${g}</span>`).join('') || '—'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Sortie</span>
                    <span class="info-value">${fmt(v.date_parution)}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Nationalité</span>
                    <span class="info-value">${v.pays || '—'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Acquis le</span>
                    <span class="info-value">${fmt(v.date_acquisition)}</span>
                </div>`;
        }

        // ── FETCH ─────────────────────────────────────────────
        async function init() {
            if (!id) {
                window.location.href = 'collection.html';
                return;
            }

            try {
                const [{ data: v }, { data: tracks }] = await Promise.all([
                    supabase.from('vinyles').select('*').eq('id', id).single(),
                    supabase.from('tracks').select('*').eq('vinyle_id', id).order('position')
                ]);

                if (!v) throw new Error('Album introuvable');
                renderVinyle(v, tracks || []);

            } catch (err) {
                console.error(err);
                document.getElementById('bioText').textContent = 'Album introuvable.';
            }
        }

        init();

        // ── MENU ─────────────────────────────────────────────
        const overlay   = document.getElementById('menuOverlay');
        const hamburger = document.getElementById('hamburger');
        const closeBtn  = document.getElementById('menuClose');

        hamburger.addEventListener('click', () => overlay.classList.add('open'));
        closeBtn.addEventListener('click',  () => overlay.classList.remove('open'));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    </script>
