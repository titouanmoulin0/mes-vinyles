    <!-- PAGE HEADER -->
    <div class="collection-header">
        <h1 class="collection-title">La Collection</h1>
        <p class="collection-count" id="collection-count">— Albums</p>
    </div>

    <!-- SEARCH + TRI -->
    <div class="collection-search">
        <div class="search-row">
            <div class="search-field">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="6.5" cy="6.5" r="5" stroke="#171717" stroke-width="1.5"/>
                    <path d="M10.5 10.5L14 14" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <input
                    class="search-input"
                    type="text"
                    id="search"
                    placeholder="Rechercher un album"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>
            <button class="sort-btn" id="sortBtn" aria-label="Trier">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 4h12M4 8h8M6 12h4" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <!-- DROPDOWN TRI -->
        <div class="sort-dropdown" id="sortDropdown">
            <button class="sort-option active" data-sort="artiste-asc">Artiste A → Z</button>
            <button class="sort-option" data-sort="nom-asc">Album A → Z</button>
            <button class="sort-option" data-sort="parution-asc">Parution ↑</button>
            <button class="sort-option" data-sort="parution-desc">Parution ↓</button>
            <button class="sort-option" data-sort="acquisition-asc">Acquis ↑</button>
            <button class="sort-option" data-sort="acquisition-desc">Acquis ↓</button>
        </div>
    </div>

    <!-- GRID -->
    <div class="collection-grid" id="collection-grid">
        <div class="grid-skeleton"></div>
        <div class="grid-skeleton"></div>
        <div class="grid-skeleton"></div>
        <div class="grid-skeleton"></div>
        <div class="grid-skeleton"></div>
        <div class="grid-skeleton"></div>
    </div>

    <div class="bottom-space"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabase = createClient(
            'https://zajqhodbbxwzkauupsch.supabase.co',
            'sb_publishable_Yu8voA0zf_wgOHIMRMwTNg_7A_tb__T'
        );

        let allVinyles = [];
        let currentSort = 'artiste-asc';

        // ── SORT ─────────────────────────────────────────────
        function sortVinyles(items, sort) {
            return [...items].sort((a, b) => {
                switch (sort) {
                    case 'artiste-asc':
                        return (a.artiste || '').localeCompare(b.artiste || '');
                    case 'nom-asc':
                        return (a.nom || '').localeCompare(b.nom || '');
                    case 'parution-asc':
                        return new Date(a.date_parution || 0) - new Date(b.date_parution || 0);
                    case 'parution-desc':
                        return new Date(b.date_parution || 0) - new Date(a.date_parution || 0);
                    case 'acquisition-asc':
                        return new Date(a.date_acquisition || 0) - new Date(b.date_acquisition || 0);
                    case 'acquisition-desc':
                        return new Date(b.date_acquisition || 0) - new Date(a.date_acquisition || 0);
                    default:
                        return 0;
                }
            });
        }

        // ── RENDER ───────────────────────────────────────────
        function cardHTML(v) {
            const cover = v.cover_url || `assets/covers/${v.id}.jpg`;
            return `
                <a class="grid-card" href="vinyle.html?id=${v.id}">
                    <img src="${cover}" alt="${v.nom}" loading="lazy" />
                </a>`;
        }

        function render(items) {
            const grid = document.getElementById('collection-grid');
            if (!items.length) {
                grid.innerHTML = '<p class="grid-empty">Aucun résultat</p>';
                return;
            }
            grid.innerHTML = sortVinyles(items, currentSort).map(cardHTML).join('');
        }

        function updateCount(n, query = '') {
            const el = document.getElementById('collection-count');
            el.textContent = query
                ? `${n} résultat${n > 1 ? 's' : ''}`
                : `${n} Album${n > 1 ? 's' : ''}`;
        }

        // ── SEARCH ───────────────────────────────────────────
        document.getElementById('search').addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) {
                render(allVinyles);
                updateCount(allVinyles.length);
                return;
            }
            const filtered = allVinyles.filter(v =>
                v.nom.toLowerCase().includes(q) ||
                v.artiste.toLowerCase().includes(q)
            );
            render(filtered);
            updateCount(filtered.length, q);
        });

        // ── SORT DROPDOWN ────────────────────────────────────
        const sortBtn      = document.getElementById('sortBtn');
        const sortDropdown = document.getElementById('sortDropdown');

        sortBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sortDropdown.classList.toggle('open');
            sortBtn.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            sortDropdown.classList.remove('open');
            sortBtn.classList.remove('active');
        });

        document.querySelectorAll('.sort-option').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSort = btn.dataset.sort;

                // Mise à jour visuelle
                document.querySelectorAll('.sort-option').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Fermer le dropdown
                sortDropdown.classList.remove('open');
                sortBtn.classList.remove('active');

                // Re-render avec le nouveau tri
                const q = document.getElementById('search').value.trim().toLowerCase();
                const base = q
                    ? allVinyles.filter(v =>
                        v.nom.toLowerCase().includes(q) ||
                        v.artiste.toLowerCase().includes(q))
                    : allVinyles;
                render(base);
            });
        });

        // ── INIT ─────────────────────────────────────────────
        async function init() {
            try {
                const { data, error } = await supabase
                    .from('vinyles')
                    .select('id, nom, artiste, cover_url, date_parution, date_acquisition')
                    .eq('type', 'collection');

                if (error) throw error;

                allVinyles = data;
                updateCount(allVinyles.length);
                render(allVinyles);

            } catch (err) {
                console.error(err);
                document.getElementById('collection-grid').innerHTML =
                    '<p class="grid-empty">Erreur de connexion</p>';
            }
        }

        init();

        // ── MENU ─────────────────────────────────────────────
        const overlay   = document.getElementById('menuOverlay');
        const hamburger = document.getElementById('hamburger');
        const closeBtn  = document.getElementById('menuClose');

        hamburger.addEventListener('click', () => overlay.classList.add('open'));
        closeBtn.addEventListener('click',  () => overlay.classList.remove('open'));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    </script>
